name: bundle-sync

on:
  push:
    paths:
      - bundle/bundle.json
      - bundle/definitions/**
      - .config/dotnet-tools.json
      - .github/workflows/bundle-sync.yaml
      - scripts/resolve-bundle-operation-version.sh
      - scripts/resolve-latest-release-tag.sh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
      synchronized_sha: ${{ steps.synchronized.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve latest published release
        id: published_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$(bash scripts/resolve-latest-release-tag.sh --repository "${GITHUB_REPOSITORY}")"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Guard bundle version ownership
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          operation="verify"
          if [[ "${REF_NAME}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            operation="verify-release"
          fi

          bash scripts/resolve-bundle-operation-version.sh \
            --operation "${operation}" \
            --root bundle \
            --base-ref "refs/tags/${{ steps.published_release.outputs.tag }}"

      - name: Sync canonical bundle
        id: bundle
        uses: mackysoft/agent-distribution/actions/sync@5.0.0
        with:
          root: bundle

      - name: Capture synchronized commit
        id: synchronized
        if: steps.bundle.outputs.changed == 'true'
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  dispatch:
    name: dispatch verification
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Dispatch verification for synchronized commit
        env:
          EXPECTED_SHA: ${{ needs.sync.outputs.synchronized_sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run verify.yaml
          --repo "${GITHUB_REPOSITORY}"
          --ref "${GITHUB_REF_NAME}"
          --field expected_sha="${EXPECTED_SHA}"
