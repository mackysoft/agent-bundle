name: verify

env:
  DOTNET_SOLUTION: AgentBundle.slnx

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA that a synchronizing workflow expects this run to verify.
        required: false
        type: string
      bundle_operation:
        description: Bundle version ownership rule for this exact commit.
        required: false
        default: verify
        type: choice
        options:
          - verify
          - verify-release
          - verify-default-branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: synchronized source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard synchronized commit
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "${EXPECTED_SHA}" && "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Expected synchronized commit ${EXPECTED_SHA}, but workflow_dispatch resolved ${ACTUAL_SHA}." >&2
            exit 1
          fi

      - name: Resolve latest published release
        id: published_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$(bash scripts/resolve-latest-release-tag.sh --repository "${GITHUB_REPOSITORY}")"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Guard bundle version ownership
        env:
          DISPATCH_OPERATION: ${{ inputs.bundle_operation }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          operation="verify"
          if [[ "${EVENT_NAME}" == "push" && "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            operation="verify-default-branch"
          elif [[ "${EVENT_NAME}" == "push" && "${REF_NAME}" == release/* ]]; then
            if [[ "${REF_NAME}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              operation="verify-release"
            else
              echo "Release branch must use release/<major>.<minor>.<patch> format: ${REF_NAME}" >&2
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            operation="${DISPATCH_OPERATION:-verify}"
          fi

          bash scripts/resolve-bundle-operation-version.sh \
            --operation "${operation}" \
            --source bundle \
            --base-ref "refs/tags/${{ steps.published_release.outputs.tag }}"

  verify:
    name: verify
    needs: source
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Python for Agent Benchmarking helpers
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('AgentBundle.slnx', '**/*.csproj', '.config/dotnet-tools.json') }}

      - name: Restore
        run: dotnet restore "$DOTNET_SOLUTION"

      - name: Verify source and build distribution bundle
        run: >-
          bash scripts/verify.sh
          --no-restore
          --solution "$DOTNET_SOLUTION"
          --configuration Release

      - name: Pack CLI tool
        run: >-
          dotnet pack src/AgentBundle/AgentBundle.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Smoke test CLI tool package
        run: bash scripts/verify-cli-package.sh artifacts/packages 0.0.0

  test:
    needs: source
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - shell: bash
        run: sh scripts/test-git-skill-helpers.sh

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - source
      - verify
      - test
    if: always()

    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail

          for job in SOURCE VERIFY TEST; do
            result_variable="${job}_RESULT"
            result="${!result_variable}"
            if [[ "${result}" != "success" ]]; then
              echo "${job,,} job is required but finished with ${result}." >&2
              exit 1
            fi
          done

          echo "All required verification jobs completed successfully."
