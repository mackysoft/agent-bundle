name: verify

env:
  DOTNET_SOLUTION: AgentBundle.slnx

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA that a synchronizing workflow expects this run to verify.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: synchronized source
    runs-on: ubuntu-latest

    steps:
      - name: Guard synchronized commit
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "${EXPECTED_SHA}" && "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Expected synchronized commit ${EXPECTED_SHA}, but workflow_dispatch resolved ${ACTUAL_SHA}." >&2
            exit 1
          fi

  verify:
    name: verify
    needs: source
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('AgentBundle.slnx', '**/*.csproj', '.config/dotnet-tools.json') }}

      - name: Restore
        run: dotnet restore "$DOTNET_SOLUTION"

      - name: Verify source and generated bundle
        run: >-
          bash scripts/verify.sh
          --no-restore
          --solution "$DOTNET_SOLUTION"
          --configuration Release

      - name: Pack CLI tool
        run: >-
          dotnet pack src/AgentBundle/AgentBundle.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Smoke test CLI tool package
        run: bash scripts/verify-cli-package.sh artifacts/packages 0.0.0

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - source
      - verify
    if: always()

    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail

          for job in SOURCE VERIFY; do
            result_variable="${job}_RESULT"
            result="${!result_variable}"
            if [[ "${result}" != "success" ]]; then
              echo "${job,,} job is required but finished with ${result}." >&2
              exit 1
            fi
          done

          echo "All required verification jobs completed successfully."
