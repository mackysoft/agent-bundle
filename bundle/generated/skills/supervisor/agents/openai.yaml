interface:
  display_name: "Supervisor"
  short_description: "利用者が直接操作する現在のタスクで、受領内容を独立した目的へ分別し、目的境界と既存タスクの統括責務から新規、継続、分割、重複、要確認を判定するときに適用する。目的ごとに $orchestrator を適用する新規タスクを作成するか既存タスクへ追加内容を届け、目的、判定理由、割当先、引き渡し状態を管理する。"
  default_prompt: "Use $supervisor to follow the Supervisor workflow."

policy:
  allow_implicit_invocation: true
