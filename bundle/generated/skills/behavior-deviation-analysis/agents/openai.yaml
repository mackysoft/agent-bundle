interface:
  display_name: "Behavior Deviation Analysis"
  short_description: "エージェントのセッション、Skillまたはcustom agentの挙動検証結果、成果物、差分、レビュー、修正指示を調べ、期待した挙動から最初に逸脱した地点、主原因、従原因、再発性、影響を特定する。原因をSkill、custom agent定義、選択とオーケストレーション、host bindingとruntime、配布基盤、製品またはツール、作業条件、検証手段、実行上の逸脱へ帰属させ、修正責任と再検証範囲を示すときに使う。"
  default_prompt: "Use $behavior-deviation-analysis to follow the Behavior Deviation Analysis workflow."

policy:
  allow_implicit_invocation: true
