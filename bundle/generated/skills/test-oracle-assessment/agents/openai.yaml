interface:
  display_name: "Test Oracle Assessment"
  short_description: "既存または候補の自動テストについて、アサート、例外期待、スナップショット、ゴールデン値、モック検証、プロパティ、終了条件などの合否判定が、確認済みの契約に適合し、現在実装を期待結果へ写した自己充足的な判定になっていないかを読み取り専用で評価するときに使う。契約根拠、期待結果と観測結果の導出経路、共通依存、許容される変化、対象とする契約違反、検出証拠を対応付け、契約適合性、独立性、検出証拠の状態と未確認事項を返す。テストの作成、修正、実行、変更全体の受け入れ、セキュリティー、CI判定は扱わない。"
  default_prompt: "Use $test-oracle-assessment to follow the Test Oracle Assessment workflow."

policy:
  allow_implicit_invocation: true
