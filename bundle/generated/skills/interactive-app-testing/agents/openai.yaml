interface:
  display_name: "Interactive App Testing"
  short_description: "Web、業務アプリ、デスクトップアプリ、モバイルアプリ、ゲームなどの対話型アプリを利用者経路で実際に操作し、表示、状態遷移、既知問題の再現、媒体証拠、後始末を確認するときに使う。固定済みの実行契約、または対象変更、権限ある期待、変更リスク、既知の所見から有限の操作範囲を定め、許可された環境で実行する。確認範囲、比較結果、直接観測した候補所見、再現状態、スクリーンショット、録画、ログ、トレース、未確認範囲、後始末後の状態、共有用の証拠説明を返す。"
  default_prompt: "Use $interactive-app-testing to follow the Interactive App Testing workflow."

policy:
  allow_implicit_invocation: true
