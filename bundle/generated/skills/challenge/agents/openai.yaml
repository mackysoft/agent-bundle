interface:
  display_name: "Challenge"
  short_description: "目的、要求、権限ある規範、局所文脈に照らして、成果物、設計、コード、構造上の選択の存在理由を問い、未説明の複雑さ、具体的な問い、確認済みの契約を維持するより小さい反実仮想を、採否前の異議形成結果として返すときに使う。対象の正当化に必要な根拠が揃う場合は、確認範囲を伴う候補なしの結果を返す。"
  default_prompt: "Use $challenge to follow the Challenge workflow."

policy:
  allow_implicit_invocation: true
