interface:
  display_name: "Challenge"
  short_description: "現在の問題設定、主要前提、作業分解、責務境界、設計または実装方針が後続作業を拘束する場面で、全体目的、権限ある規範、周辺責務、既存経路、下流影響、作業経過に照らしてその方向を反証し、採否前の異議候補と影響範囲を返す。方向判断を変え得る論点がない場合は確認範囲を、評価材料が不足する場合は不足する文脈と再評価条件を、方向選択がない場合は非適用の理由を返す。"
  default_prompt: "Use $challenge to follow the Challenge workflow."

policy:
  allow_implicit_invocation: true
