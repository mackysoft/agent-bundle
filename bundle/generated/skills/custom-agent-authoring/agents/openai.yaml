interface:
  display_name: "Custom Agent Authoring"
  short_description: "custom agentを新規作成、更新、レビューするときに、単一の成果責務、選択面、入力、判断、行動、作用、成果、handoff、停止条件、下位委譲方針を定め、host非依存の指示、Skill依存、host bindingへ正しく分離する。構造検証と隔離した挙動検証を反復し、実際に選択・起動されたagentが意図した責務を果たす定義へ仕上げるときに使う。"
  default_prompt: "Use $custom-agent-authoring to follow the Custom Agent Authoring workflow."

policy:
  allow_implicit_invocation: true
