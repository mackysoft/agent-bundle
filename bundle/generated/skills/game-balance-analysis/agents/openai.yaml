interface:
  display_name: "Game Balance Analysis"
  short_description: "意味と適用範囲が確定したゲームルール、定量的な問い、結果が影響する設計判断から、変数、単位、時間幅、戦略またはシナリオを持つ再現可能なモデルを作り、計算、表計算、シミュレーション、感度分析によって成立範囲、支配条件、破綻条件、回復可能性、数値候補を分析する。ゲーム内経済、資源収支、確率、需要、成長、戦略利得、失敗後の回復を定量的に調整または評価するときに使う。"
  default_prompt: "Use $game-balance-analysis to follow the Game Balance Analysis workflow."

policy:
  allow_implicit_invocation: true
