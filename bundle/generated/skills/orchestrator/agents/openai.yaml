interface:
  display_name: "Orchestrator"
  short_description: "利用者が直接操作する現在のタスクで、一つの目的を成果責務へ分解し、必要能力に一致するサブエージェントを割り当て、担当間の成果の引き渡し、依存、実行状態、完了または停止を統括するときに適用する。専門成果と対象状態の調査、作成、変更、監視、レビュー、検証は担当へ委ね、現在のタスクでは責務と担当の対応および割当理由を管理する。"
  default_prompt: "Use $orchestrator to follow the Orchestrator workflow."

policy:
  allow_implicit_invocation: true
