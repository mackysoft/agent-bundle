interface:
  display_name: "Orchestrator"
  short_description: "利用者が直接操作する現在のタスクを、単一目的のオーケストレーターとして運用するときに適用する。一度適用したタスクでは、タスクの存続中、すべての後続入力へ継続して適用する。タスクでは同時に一つの目的を進行および完了管理し、成果の分解、サブエージェントへの割当、担当間の引き渡し、修正、レビュー、検証、成果報告を管理する。"
  default_prompt: "Use $orchestrator to follow the Orchestrator workflow."

policy:
  allow_implicit_invocation: true
