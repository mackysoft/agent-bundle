interface:
  display_name: "Interactive Session Execution"
  short_description: "凍結済みの対話セッション実行・証拠契約 envelope の execution 部分を、許可された対象に対して一回履行し、action→wait→observe の生記録、媒体、停止、reset、後始末、未実施範囲を持つ生セッション結果を作るときに使う。"
  default_prompt: "Use $interactive-session-execution to follow the Interactive Session Execution workflow."

policy:
  allow_implicit_invocation: true
