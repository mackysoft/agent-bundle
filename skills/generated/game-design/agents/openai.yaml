interface:
  display_name: "Game Design"
  short_description: "ゲーム企画の意図、対象プレイヤー、プレイ条件、既存設計、プレイテストの観測から、プレイヤーが得る情報、行う活動や選択、ルールによる状態変化、フィードバック、次の活動の因果を設計、更新、評価し、狙う体験につながるゲーム設計案または設計上の評価を作る。コアループ、選択の意味、資源とリスク、成功と失敗、回復、進行、ランダム性、システム間の誘因を検討するときに使う。"
  default_prompt: "Use $game-design to follow the Game Design workflow."

policy:
  allow_implicit_invocation: true
