interface:
  display_name: "Verification Gate"
  short_description: "変更が受け入れ可能かを判断するために、受け入れ条件へ対応する検証面と検証方法を選び、リポジトリの専用スクリプト、CI と同じコマンド、根拠との比較、表示や操作の確認などを実行する。成功、失敗原因、未検証範囲、次に必要な作業を残す。"
  default_prompt: "Use $verification-gate to follow the Verification Gate workflow."

policy:
  allow_implicit_invocation: true
