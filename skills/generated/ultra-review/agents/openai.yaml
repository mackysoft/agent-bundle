interface:
  display_name: "Ultra Review"
  short_description: "ユーザーの依頼または適用される作業規約が、成果物、変更差分、または指定範囲に対する複数の独立したレビュー作業による深い最終点検、修正込みの反復レビュー、または ultra-review を明示的に要求するときに使う。レビュー計画、個別レビュー、一つのトリアージ作業、採用所見の設計・実装・定型作業、検証判断、許可された検証手順の実行、検証手段の実装、再レビューをそれぞれの所有責務へ割り当てる。作業の生成、依存順序、実行担当の解決、入力と結果の配送、反復、収束状態を所有するオーケストレーション技能として、レビュー状態、所見判定、修正結果、受け入れ検証判定、未完了範囲を返す。"
  default_prompt: "Use $ultra-review to follow the Ultra Review workflow."

policy:
  allow_implicit_invocation: true
